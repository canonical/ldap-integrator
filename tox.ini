[tox]
no_package = True
skip_missing_interpreters = True
env_list = format, lint, static, unit
min_version = 4.0.0
requires =
    tox-uv

[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/tests
;lib_path = {tox_root}/lib/charms/operator_name_with_underscores
all_path = {[vars]src_path} {[vars]tests_path}

[testenv]
base_python = python3.10
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
pass_env =
    PYTHONPATH
    CHARM_BUILD_DIR
    MODEL_SETTINGS
runner = uv-venv-lock-runner

[testenv:py]
description = Prepare local development tools
dependency_groups = dev
commands =
    pre-commit install -t commit-msg

[testenv:fmt]
description = Apply coding style standards to code
dependency_groups = fmt
commands =
    isort {[vars]all_path}
    ruff format {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
dependency_groups = lint
commands =
    codespell {toxinidir}/
    isort --check-only --diff {[vars]all_path}
    ruff check --show-fixes {[vars]all_path}

[testenv:unit]
description = Run unit tests
dependency_groups = unit
commands =
    coverage run --source={[vars]src_path} \
        -m pytest --ignore={[vars]tests_path}/integration -vv --tb native -s {posargs}
    coverage report --data-file={toxinidir}/.coverage/.coverage
    coverage xml --data-file={toxinidir}/.coverage/.coverage

[testenv:integration]
description = Run integration tests
depends =
    build-prerequisites
pass_env =
    CHARM_PATH
dependency_groups = integration
commands =
    pytest -v \
           -s \
           --tb native \
           --log-cli-level=INFO \
           {posargs} \
           {[vars]tests_path}/integration

[testenv:build-prerequisites]
description = Install necessary Linux packages for python dependencies
runner = virtualenv
dependency_groups =
allowlist_externals =
    sudo
    apt-get
commands =
    sudo apt-get update
    sudo apt-get install -y python3-dev \
        libldap2-dev \
        libsasl2-dev
